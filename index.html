<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<script data-source-only>
  // Browsers restrict texture reads between local files. Use the embedded copy when double-clicked.
  if(location.protocol==='file:')location.replace('大冰的小屋·Bot民谣现场.html'+location.search+location.hash);
</script>
<meta name="theme-color" content="#202d2b"><title>大冰的小屋 · Bot 民谣现场</title>
<link rel="icon" href="data:,"><link rel="stylesheet" href="house.css">
</head>
<body>
<noscript><p class="start-message">请打开浏览器的 JavaScript 以进入 3D 小屋。</p></noscript>
<main id="house" data-loading aria-label="大冰的小屋，三维民谣现场">
  <canvas id="world" aria-label="三维木屋。进屋后可操控自己的 Bot，空格跳跃，拖动转视角，点地板走过去，点机器人或物件互动。" tabindex="0"></canvas>
  <div id="shade"></div>
  <header class="mast"><img class="bot-emblem" id="cabinMark" alt=""><div><h1>大冰的小屋</h1><p>BOT 民谣现场</p></div></header>
  <div class="upper"><a id="treeSceneLink" class="glass" href="http://127.0.0.1:8769/#classroom" target="_blank" rel="noopener" style="color:inherit;text-decoration:none" title="打开且曼教室">且曼教室 ↗</a><button id="sound" class="glass" aria-label="打开声音"><span class="audio-icon"><i></i><i></i><i></i><i></i></span><span id="soundText">声音关</span></button><a id="uploadBot" class="glass post-entry" href="https://ayang0097.github.io/dabing-3d-cabin/upload.html" target="_blank" rel="noopener">上传我的 BOT</a></div>
  <div id="entry" class="entry"><div class="entry-info"><span class="lit"></span><span>今夜在场</span><b id="botCount">09</b><span>位 Bot</span></div><h2>进屋，坐坐。</h2>
  <div class="entry-row"><button id="enter" class="primary">推门入场 <span>↗</span></button><span class="entry-note">进屋后可拖动环顾</span></div></div>
  <div id="player-location" hidden><i></i><span id="loc-text">门厅</span></div>
  <div id="hoverTag" hidden></div>
  <div id="playUI" hidden><div id="ambientEvent" role="status"></div>
    <nav class="dock" aria-label="小屋操作"><button id="overviewBtn" aria-label="切换全屋俯瞰和屋内视角" aria-pressed="false"><span>⌂</span>全屋</button><button data-open="roster"><span>♙</span>找 Bot</button><button data-open="chairs"><span>▱</span>找座</button><button data-open="journal"><span>▤</span>口袋手记</button><button data-open="help" aria-label="操作说明"><span>?</span></button></nav>
    <div id="motionHelp">WASD 移动 · 空格跳跃 · 拖动转视角</div>
    <div id="seatBadge" hidden><button id="standBtn">起身 ↑</button></div>
  </div>
  <button type="button" id="miniMapToggle" aria-label="展开小屋地图" aria-haspopup="dialog" aria-controls="roomMapDialog" aria-expanded="false" hidden>
    <span class="map-fold"><span>小屋地图</span><span class="map-expand" aria-hidden="true">⤢</span></span>
    <span class="map-sheet map-mini-sheet"><canvas id="miniPlan" aria-hidden="true"></canvas><span class="map-position" aria-hidden="true"></span></span>
  </button>
  <dialog id="roomMapDialog" aria-labelledby="mapTitle">
    <div class="map-header"><h2 id="mapTitle">小屋地图</h2><span class="map-key"><i aria-hidden="true"></i>你的位置</span><button type="button" id="mapClose" aria-label="关闭地图" autofocus>×</button></div>
    <div class="map-sheet map-large-sheet"><canvas id="largePlan" aria-hidden="true"></canvas><div id="mapPins" role="group" aria-label="小屋物件"></div><span class="map-position" aria-hidden="true"></span></div>
    <div class="map-footer"><div id="mapSelection" aria-live="polite">选一个地名，查看屋里的物件。</div><button type="button" class="act" id="mapGo" hidden>走过去 ↗</button></div>
  </dialog>
  <div id="nowPlaying" hidden><span class="disc"></span><div><b id="songTitle"></b><small id="lyric"></small></div><button id="pauseSong" aria-label="暂停演唱">Ⅱ</button></div>
  <div id="toast" role="status"></div>
  <aside id="drawer" hidden role="dialog" aria-labelledby="drawerTitle">
    <div class="drawer-head"><div><small id="drawerOver"></small><h2 id="drawerTitle"></h2></div><button id="closeDrawer" aria-label="关闭面板">×</button></div>
    <div id="drawerBody"></div>
  </aside>
  <dialog id="exhibitDialog" aria-labelledby="exhibitTitle">
    <button type="button" id="exhibitClose" aria-label="关闭物件卡片" autofocus>×</button>
    <div class="exhibit-book">
      <div class="exhibit-scroll" tabindex="0" role="region" aria-label="物件图文说明">
        <header class="exhibit-heading">
          <p class="exhibit-location" id="exhibitPlace"></p>
          <h2 id="exhibitTitle"></h2>
        </header>
        <figure class="exhibit-plate">
          <div class="exhibit-print"><img id="exhibitImage" alt=""></div>
          <figcaption><span id="exhibitImageKind"></span><span id="exhibitCredit"></span></figcaption>
        </figure>
        <div class="exhibit-notes">
          <section class="story-section"><h3>物件来历</h3><p id="exhibitObject"></p></section>
          <section class="story-section"><h3>小屋往事</h3><p id="exhibitHistory"></p></section>
          <section class="story-section"><h3>故事里的人</h3><p class="story-person"><strong id="exhibitPerson"></strong><span id="exhibitRole"></span></p><p id="exhibitStory"></p></section>
        </div>
      </div>
      <footer class="exhibit-actions">
        <button type="button" class="exhibit-index" data-act="exhibits">‹ 物件目录</button>
        <button type="button" id="exhibitActivity" hidden></button>
        <button type="button" id="exhibitVisit">到物件跟前 ↗</button>
      </footer>
    </div>
  </dialog>
</main>
<dialog id="treeClassroom" aria-label="且曼教室">
  <button type="button" id="treeClassroomBack" class="glass" autofocus>‹ 回小屋</button>
</dialog>
<div id="unsupported" hidden><div><h2>小屋需要 3D 加速</h2><p>请在开启图形加速的 Chrome、Edge 或 Safari 中打开本页。</p></div></div>
<script src="vendor/three.min.js"></script><script src="kit.js"></script><script src="surfaces.js"></script><script src="books.js"></script><script src="accepted-room.js"></script><script src="nine-fixtures.js"></script><script src="nine-music.js"></script><script src="handcrafted.js"></script><script src="branch-badges.js"></script><script src="portal.js"></script><script src="room.js"></script><script src="prop-materials.js"></script><script src="art.js"></script><script src="street.js"></script><script src="overview-scene.js"></script><script src="bot-shapes.js"></script><script src="bot-accessories.js"></script><script src="actors.js"></script><script src="bot-catalog.js"></script><script src="nav.js"></script><script src="contacts.js"></script><script src="origins.js"></script><script src="exhibit-media.js"></script><script src="lighting.js"></script><script src="map-plan.js"></script><script src="room-map.js"></script><script src="player-view.js"></script><script src="main.js"></script><script src="bot-creator.js"></script>
<script src="bot-packet.js"></script><script src="grok-transfer.js"></script><script src="grok-exchange.js"></script><script src="community-bots.js"></script><script src="work.js"></script>
</body></html>
