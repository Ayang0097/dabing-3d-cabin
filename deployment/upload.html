<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#261a13">
  <meta name="referrer" content="no-referrer">
  <title>上传我的 BOT · 大冰的小屋</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="upload.css">
  <script src="site-config.js" defer></script>
  <script src="bot-api.js" defer></script>
  <script src="vendor/three.min.js" defer></script>
  <script src="bot-shapes.js" defer></script>
  <script src="bot-packet.js" defer></script>
  <script src="public-upload.js" defer></script>
</head>
<body class="cabin-upload">
  <main class="upload-page">
    <img class="upload-backdrop" src="upload-scene.webp" width="1920" height="1080" alt="" fetchpriority="high">
    <a class="upload-back" href="./"><span aria-hidden="true">←</span> 回小屋</a>
    <section class="upload-sheet" aria-labelledby="uploadTitle">
      <div class="upload-heading">
        <h1 id="uploadTitle">上传我的 BOT</h1>
        <a class="upload-switch" id="uploadSwitch" href="./upload.html?mode=edit">我的 BOT</a>
      </div>
      <form class="upload-form" id="myBotsAccess" method="post" hidden>
        <div class="upload-field">
          <label for="personalKey">个人密钥</label>
          <input id="personalKey" type="password" required maxlength="256" autocomplete="off" spellcheck="false" autocapitalize="none" placeholder="输入屋主发给你的个人密钥">
        </div>
        <button class="upload-submit" type="submit" disabled>查看我的 BOT</button>
      </form>
      <div class="upload-editor-tools" id="myBotsTools" hidden>
        <div class="upload-field">
          <label for="myBotChoice">选择要编辑的 BOT</label>
          <select id="myBotChoice"></select>
        </div>
        <div class="upload-actions">
          <button class="upload-quiet" id="moreMyBots" type="button" hidden>更多 BOT</button>
          <button class="upload-quiet" id="switchPersonalKey" type="button">退出个人管理</button>
        </div>
      </div>
      <form class="upload-form" method="post" data-mode="upload" hidden>
        <div class="upload-fields upload-source">
          <div class="upload-field" id="uploadKeyField">
            <label for="uploadKey">上传密钥</label>
            <input id="uploadKey" type="password" required maxlength="256" autocomplete="off" spellcheck="false" autocapitalize="none" placeholder="输入屋主给你的密钥">
          </div>
          <div class="upload-field">
            <div class="upload-field-label">
              <label for="templateUrl" id="templateLabel">BOT 链接</label>
              <a class="upload-link-help" href="https://docs.x.ai/grok-bot/bots#share-a-bot" target="_blank" rel="noopener noreferrer">如何获取 BOT 链接？</a>
            </div>
            <input id="templateUrl" type="url" required maxlength="1000" placeholder="https://x.ai/bot/…" autocomplete="off" spellcheck="false" autocapitalize="none">
          </div>
        </div>
        <div class="upload-fields">
          <div class="upload-field">
            <label for="botName">BOT 名称</label>
            <input id="botName" type="text" required maxlength="20" placeholder="小屋名片上的名字">
          </div>
          <div class="upload-field">
            <label for="botIntro">BOT 使用介绍 <span>（选填）</span></label>
            <textarea id="botIntro" rows="2" maxlength="1200" placeholder="粘贴 BOT 链接后自动带入，可修改" aria-describedby="introStatus"></textarea>
            <p class="upload-hint" id="introStatus" role="status"></p>
          </div>
        </div>
        <fieldset class="upload-group">
          <legend>BOT 外观</legend>
          <div class="upload-appearance">
            <div class="upload-preview">
              <img id="botPreview" alt="BOT 外观预览" width="96" height="96">
            </div>
            <div class="upload-field upload-shape">
              <label for="botShape">形状</label>
              <select id="botShape"></select>
            </div>
            <fieldset class="upload-palette">
              <legend>颜色 <span id="botColorName"></span></legend>
              <div class="upload-swatches" id="botColors"></div>
            </fieldset>
          </div>
        </fieldset>
        <button class="upload-submit" type="submit" disabled>上传并公开<span aria-hidden="true">→</span></button>
      </form>
      <p class="upload-note" id="uploadNote">上传后，小屋访客可以复制这位 BOT。</p>
      <p id="post-status" class="upload-status" role="status"></p>
      <noscript><p class="upload-status">请启用 JavaScript 上传 BOT。</p></noscript>
    </section>
  </main>
</body>
</html>
